<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2026 Player Icon Context Review</title>
    <style>
      :root {
        color: #0f172a;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f1f5f9;
      }

      * { box-sizing: border-box; }
      body { margin: 0; }

      .page {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 38px 0 64px;
      }

      .eyebrow {
        margin: 0 0 6px;
        color: #c83803;
        font-size: 11px;
        font-weight: 850;
        letter-spacing: .16em;
        text-transform: uppercase;
      }

      h1 { margin: 0; color: #0b162a; font-size: 28px; line-height: 1.15; }
      .intro { max-width: 720px; margin: 10px 0 0; color: #475569; font-size: 14px; line-height: 1.55; }

      .style-section { margin-top: 34px; }
      .style-heading { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
      .style-heading h2 { margin: 0; color: #0b162a; font-size: 18px; }
      .style-heading span { color: #64748b; font-size: 12px; font-weight: 700; }

      .card-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
      }

      .prediction-card {
        min-width: 0;
        padding: 16px;
        border: 1px solid #cbd5e1;
        border-radius: 16px;
        background: white;
        box-shadow: 0 18px 40px rgba(15, 23, 42, .14);
      }

      .card-top { display: flex; align-items: flex-start; gap: 12px; }
      .icon-frame {
        width: 64px;
        height: 64px;
        flex: 0 0 64px;
        overflow: hidden;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        background: white;
        box-shadow: 0 8px 18px rgba(15, 23, 42, .12);
      }
      .icon-frame img { display: block; width: 100%; height: 100%; object-fit: cover; }

      .question { min-width: 0; flex: 1; }
      .question h3 { margin: 0; color: #0b162a; font-size: 16px; font-weight: 750; line-height: 1.35; }
      .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
      .pill { border-radius: 999px; padding: 2px 8px; font-size: 11px; font-weight: 750; }
      .open { background: #dcfce7; color: #166534; }
      .time { background: #f1f5f9; color: #475569; }
      .deadline { margin: 5px 0 0; color: #64748b; font-size: 11px; font-weight: 550; }

      .volume { margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(226, 232, 240, .9); }
      .volume-label { margin: 0; color: #475569; font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
      .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
      .answer { border: 1px solid #cbd5e1; border-radius: 11px; padding: 8px 10px; font-size: 12px; font-weight: 800; background: white; }
      .yes { color: #0b162a; }
      .no { color: #7a2604; border-color: rgba(200, 56, 3, .35); }

      .action {
        width: 100%;
        margin-top: 14px;
        border: 0;
        border-radius: 12px;
        padding: 9px 12px;
        color: white;
        background: #0b162a;
        box-shadow: 0 10px 20px rgba(15, 23, 42, .18);
        font-size: 12px;
        font-weight: 800;
      }

      .size-note { margin: 9px 0 0; color: #64748b; font-size: 10px; font-weight: 700; text-align: center; }

      body.focus-view .page { padding-top: 16px; padding-bottom: 16px; }
      body.focus-view .eyebrow,
      body.focus-view h1,
      body.focus-view .intro { display: none; }
      body.focus-view .style-section { margin-top: 0; }

      @media (max-width: 900px) {
        .card-grid { grid-template-columns: 1fr; }
        .prediction-card { max-width: 390px; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <p class="eyebrow">Design review · Actual mobile size</p>
      <h1>Player backgrounds inside prediction cards</h1>
      <p class="intro">Every portrait below is rendered in the current production card's 64×64 image box. Cards are shown at realistic widths with real prediction copy and controls.</p>
      <div id="preview"></div>
    </main>

    <script>
      const styles = [
        ['night-stadium', '1. Night stadium', 'Atmospheric and photographic'],
        ['turf-yard-line', '2. Turf and yard line', 'Literal football setting'],
        ['stadium-silhouette', '3. Stadium silhouette', 'Graphic and editorial'],
        ['broadcast-gradient', '4. Broadcast gradient', 'Clean and high-contrast'],
        ['playbook-pattern', '5. Playbook pattern', 'Most personality and detail'],
      ];

      const subjects = [
        ['caleb-williams', 'Caleb Williams starts all 17 games?'],
        ['ben-johnson', 'Ben Johnson wins Coach of the Year?'],
        ['rome-odunze', 'Rome Odunze leads the Bears in receiving yards?'],
      ];

      function card(style, subject, question) {
        return `
          <article class="prediction-card">
            <div class="card-top">
              <div class="icon-frame"><img src="./${style}-${subject}.png" alt="" /></div>
              <div class="question">
                <h3>${question}</h3>
                <div class="meta"><span class="pill open">Open</span><span class="pill time">Closes in 28 days</span></div>
                <p class="deadline">Deadline Sep 13, 2026 at 12:00 PM</p>
              </div>
            </div>
            <div class="volume">
              <p class="volume-label">Make your prediction</p>
              <div class="answers"><button class="answer yes">Yes</button><button class="answer no">No</button></div>
            </div>
            <button class="action">Make Prediction</button>
            <p class="size-note">Portrait shown at exactly 64 × 64 px</p>
          </article>`;
      }

      const selectedStyle = new URLSearchParams(window.location.search).get('style');
      if (selectedStyle) document.body.classList.add('focus-view');
      const visibleStyles = selectedStyle ? styles.filter(([key]) => key === selectedStyle) : styles;

      document.querySelector('#preview').innerHTML = visibleStyles.map(([key, title, note]) => `
        <section class="style-section" id="${key}">
          <div class="style-heading"><h2>${title}</h2><span>${note}</span></div>
          <div class="card-grid">${subjects.map(([subject, question]) => card(key, subject, question)).join('')}</div>
        </section>`).join('');
    </script>
  </body>
</html>
